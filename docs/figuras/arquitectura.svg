<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
    <style>
      .titulo { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
      .etapa { font-size: 13px; font-weight: 700; fill: #52514e; letter-spacing: .06em; }
      .texto { font-size: 13px; fill: #0b0b0b; }
      .sub { font-size: 12px; fill: #52514e; }
      .caja { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.2; }
      .fuente { fill: #eef4fc; stroke: #9ec5f4; stroke-width: 1.2; }
      .modelo { fill: #ffffff; stroke: #2a78d6; stroke-width: 1.6; }
      .salida { fill: #e9f7f1; stroke: #1baf7a; stroke-width: 1.4; }
      .linea { stroke: #898781; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fcfcfb"/>
  <text x="40" y="48" style="font-size:24px;font-weight:700;fill:#0b0b0b">Arquitectura de la solución</text>
  <text x="40" y="74" class="sub" style="font-size:14px">De dónde salen los datos, cómo se procesan y dónde terminan. Todo corre en local y sin internet una vez descargado.</text>

  <!-- Etiquetas de etapa -->
  <text x="40" y="120" class="etapa">1 · FUENTES</text>
  <text x="350" y="120" class="etapa">2 · INGESTA</text>
  <text x="640" y="120" class="etapa">3 · PREPARACIÓN</text>
  <text x="960" y="120" class="etapa">4 · MODELOS</text>
  <text x="1290" y="120" class="etapa">5 · CONSUMO</text>

  <!-- 1. Fuentes -->
  <rect x="40" y="140" width="260" height="78" rx="10" class="fuente"/>
  <text x="56" y="168" class="titulo">Cajeros automáticos</text>
  <text x="56" y="190" class="sub">BA Data (GCBA) · banco, red, terminales</text>
  <text x="56" y="207" class="sub">Oferta · relevamiento ≈2017</text>

  <rect x="40" y="232" width="260" height="78" rx="10" class="fuente"/>
  <text x="56" y="260" class="titulo">Censo 2022 por radio</text>
  <text x="56" y="282" class="sub">INDEC · residentes, NBI, internet, edad</text>
  <text x="56" y="299" class="sub">3.820 radios con polígono</text>

  <rect x="40" y="324" width="260" height="78" rx="10" class="fuente"/>
  <text x="56" y="352" class="titulo">Molinetes del subte</text>
  <text x="56" y="374" class="sub">SBASE · entradas cada 15 minutos</text>
  <text x="56" y="391" class="sub">2025 completo (y 2026 para validar)</text>

  <rect x="40" y="416" width="260" height="78" rx="10" class="fuente"/>
  <text x="56" y="444" class="titulo">Usos del suelo</text>
  <text x="56" y="466" class="sub">BA Data · uso de cada parcela</text>
  <text x="56" y="483" class="sub">relevamiento 2022-2024</text>

  <rect x="40" y="508" width="260" height="78" rx="10" class="fuente"/>
  <text x="56" y="536" class="titulo">OpenStreetMap</text>
  <text x="56" y="558" class="sub">comercios, estaciones, cajeros y</text>
  <text x="56" y="575" class="sub">red peatonal · 2026 · Overpass y OSMnx</text>

  <rect x="40" y="600" width="260" height="62" rx="10" class="fuente"/>
  <text x="56" y="628" class="titulo">Barrios</text>
  <text x="56" y="649" class="sub">BA Data · límites y nombres</text>

  <!-- 2. Ingesta -->
  <rect x="350" y="250" width="240" height="250" rx="12" class="caja"/>
  <text x="368" y="280" class="titulo">00 y 00b · Descarga</text>
  <text x="368" y="302" class="sub">notebooks (Colab) + src/descarga.py</text>
  <text x="368" y="336" class="texto">• reintentos ante errores</text>
  <text x="368" y="358" class="texto">  del servidor</text>
  <text x="368" y="382" class="texto">• valida cada archivo</text>
  <text x="368" y="406" class="texto">• resume lo pesado:</text>
  <text x="368" y="428" class="texto">  molinetes 650 MB → 0,4 MB</text>
  <text x="368" y="452" class="texto">• deja data/base/ versionado</text>
  <text x="368" y="476" class="texto">  en el repo (≈21 MB)</text>

  <!-- 3. Preparación -->
  <rect x="640" y="250" width="270" height="250" rx="12" class="caja"/>
  <text x="658" y="280" class="titulo">Variables por hexágono</text>
  <text x="658" y="302" class="sub">src/features.py</text>
  <text x="658" y="336" class="texto">• grilla H3 resolución 9</text>
  <text x="658" y="358" class="texto">  (≈3 × 3 manzanas)</text>
  <text x="658" y="382" class="texto">• censo → hexágono por</text>
  <text x="658" y="404" class="texto">  interpolación areal</text>
  <text x="658" y="428" class="texto">• área de influencia: hexágono</text>
  <text x="658" y="450" class="texto">  + 6 vecinos (≈400 m)</text>
  <text x="658" y="474" class="texto">• distancias caminando (Dijkstra)</text>

  <!-- 4. Modelos -->
  <rect x="960" y="150" width="280" height="132" rx="12" class="modelo"/>
  <text x="978" y="180" class="titulo">Regresión de conteos</text>
  <text x="978" y="202" class="sub">supervisado · 6 modelos comparados</text>
  <text x="978" y="230" class="texto">validación espacial por comuna</text>
  <text x="978" y="254" class="texto">→ brecha: esperado − real</text>

  <rect x="960" y="308" width="280" height="132" rx="12" class="modelo"/>
  <text x="978" y="338" class="titulo">K-Means</text>
  <text x="978" y="360" class="sub">no supervisado · silueta y codo</text>
  <text x="978" y="388" class="texto">→ tipos de zona (dónde está la brecha)</text>
  <text x="978" y="412" class="texto">→ estaciones de origen y destino</text>

  <rect x="960" y="466" width="280" height="132" rx="12" class="modelo"/>
  <text x="978" y="496" class="titulo">Cobertura máxima (MCLP)</text>
  <text x="978" y="518" class="sub">optimización · exacta (MILP) y golosa</text>
  <text x="978" y="546" class="texto">→ N ubicaciones que suman más</text>
  <text x="978" y="570" class="texto">  vecinos con un Link a 500 m a pie</text>

  <rect x="960" y="624" width="280" height="62" rx="10" class="caja"/>
  <text x="978" y="651" class="titulo">Validación temporal de la brecha</text>
  <text x="978" y="672" class="sub">contra cajeros nuevos en OSM 2026</text>

  <!-- 5. Consumo -->
  <rect x="1290" y="150" width="270" height="166" rx="12" class="salida"/>
  <text x="1308" y="180" class="titulo">App (Streamlit + deck.gl)</text>
  <text x="1308" y="206" class="texto">mapa 3D de brecha</text>
  <text x="1308" y="230" class="texto">simulador de cajeros nuevos</text>
  <text x="1308" y="254" class="texto">demanda por hora</text>
  <text x="1308" y="278" class="texto">carga del listado propio</text>
  <text x="1308" y="302" class="sub">funciona sin internet</text>

  <rect x="1290" y="342" width="270" height="110" rx="12" class="salida"/>
  <text x="1308" y="372" class="titulo">Notebooks 01, 02 y 03</text>
  <text x="1308" y="398" class="texto">calidad, EDA, modelos, horario</text>
  <text x="1308" y="422" class="texto">se pueden correr en vivo</text>

  <rect x="1290" y="478" width="270" height="110" rx="12" class="salida"/>
  <text x="1308" y="508" class="titulo">Presentación e informe</text>
  <text x="1308" y="534" class="texto">gráficos y conclusiones</text>
  <text x="1308" y="558" class="texto">para la gerencia</text>

  <!-- Flechas: fuentes -> ingesta -->
  <path d="M300,179 C325,179 325,300 348,300" class="linea" marker-end="url(#flecha)"/>
  <path d="M300,271 C325,271 325,330 348,330" class="linea" marker-end="url(#flecha)"/>
  <path d="M300,363 C325,363 325,370 348,370" class="linea" marker-end="url(#flecha)"/>
  <path d="M300,455 C325,455 325,410 348,410" class="linea" marker-end="url(#flecha)"/>
  <path d="M300,547 C325,547 325,450 348,450" class="linea" marker-end="url(#flecha)"/>
  <path d="M300,631 C325,631 325,480 348,480" class="linea" marker-end="url(#flecha)"/>
  <!-- ingesta -> preparación -->
  <path d="M590,375 L638,375" class="linea" marker-end="url(#flecha)"/>
  <!-- preparación -> modelos -->
  <path d="M910,330 C935,330 935,216 958,216" class="linea" marker-end="url(#flecha)"/>
  <path d="M910,375 L958,375" class="linea" marker-end="url(#flecha)"/>
  <path d="M910,420 C935,420 935,532 958,532" class="linea" marker-end="url(#flecha)"/>
  <!-- modelos -> consumo -->
  <path d="M1240,216 C1265,216 1265,240 1288,240" class="linea" marker-end="url(#flecha)"/>
  <path d="M1240,374 C1265,374 1265,397 1288,397" class="linea" marker-end="url(#flecha)"/>
  <path d="M1240,532 C1265,532 1265,533 1288,533" class="linea" marker-end="url(#flecha)"/>

  <text x="40" y="726" class="sub">Repositorio: github.com/ValentinoDiaz0509/CienciaDeDatos · Metodología: CRISP-DM · Datos: GCBA, INDEC, SBASE, © colaboradores de OpenStreetMap</text>
</svg>
